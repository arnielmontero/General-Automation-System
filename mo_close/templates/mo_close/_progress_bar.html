{% if p.total %}
<div class="d-flex align-items-center gap-2">
  <div class="progress flex-grow-1" role="progressbar" aria-valuenow="{{ p.percent }}" aria-valuemin="0" aria-valuemax="100">
    <div class="progress-bar {% if p.percent == 100 %}bg-done{% endif %}" style="width: {{ p.percent }}%"></div>
  </div>
  <span class="small fw-semibold">{{ p.final }}/{{ p.total }}</span>
</div>
{% else %}<span class="small-note">Not generated</span>{% endif %}
