# General Automation System (new, standalone): web app (Django) + PostgreSQL.
# Start: docker compose up -d --build   →   http://<this-pc>:${WEB_PORT}

name: general-automation-system

services:
  web:
    build: .
    image: general-automation-system-web:latest
    env_file: .env
    environment:
      DB_HOST: db
    ports:
      - "${WEB_PORT:-8085}:8000"
    volumes:
      - media:/app/media
    depends_on:
      db:
        condition: service_healthy
    restart: unless-stopped

  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: ${POSTGRES_DB}
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
    volumes:
      - db_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 10s
      timeout: 5s
      retries: 5
    restart: unless-stopped

volumes:
  db_data:
  media:
